name: Build EXE

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    
    runs-on: windows-latest

    steps:
      - name: Hae koodi repositorysta
        uses: actions/checkout@v4

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Asenna riippuvuudet
        run: |
          python -m pip install --upgrade pip
          pip install textual xlwings rich pyinstaller

      - name: Käännä sovellus .exe muotoon PyInstallerilla
        run: |
          pyinstaller --onefile --name muutavihreeks muutavihreeks.py

      - name: Lataa valmis .exe GitHubiin (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: muutavihreeks-exe
          path: dist/muutavihreeks.exe
          retention-days: 14
